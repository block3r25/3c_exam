<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Login</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #111827;
        --panel: rgba(17, 24, 39, 0.75);
        --panel-stroke: rgba(148, 163, 184, 0.18);
        --card: rgba(15, 23, 42, 0.88);
        --primary: #8b5cf6;
        --primary-2: #22c55e;
        --primary-3: #38bdf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --input: rgba(15, 23, 42, 0.9);
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 30%),
          radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 25%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .login-shell {
        width: min(1100px, 100%);
        min-height: 700px;
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        background: rgba(15, 23, 42, 0.52);
        border: 1px solid var(--panel-stroke);
        border-radius: 28px;
        box-shadow: 0 30px 80px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      .brand-panel {
        position: relative;
        padding: 52px 42px;
        background:
          linear-gradient(160deg, rgba(139, 92, 246, 0.26), rgba(15, 23, 42, 0.15)),
          rgba(15, 23, 42, 0.7);
      }

      .brand-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 25% 20%, rgba(56, 189, 248, 0.4), transparent 20%),
          radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.2), transparent 24%);
      }

      .brand-panel > * {
        position: relative;
        z-index: 1;
      }

      .brand-top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d9d8ff;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-3));
        box-shadow: 0 12px 30px rgba(139, 92, 246, 0.55);
      }

      .brand-mark::before {
        content: "A";
        font-size: 1.2rem;
        font-weight: 800;
      }

      .brand-copy {
        margin-top: 96px;
        max-width: 430px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: #cbd5e1;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.7rem, 4vw, 4.4rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      .brand-copy p {
        margin: 0;
        max-width: 360px;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.7;
      }

      .stats {
        margin-top: 52px;
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 18px;
      }

      .stat {
        padding: 18px 18px 14px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.22);
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        letter-spacing: -0.04em;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .form-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: rgba(15, 23, 42, 0.45);
      }

      .login-card {
        width: min(100%, 430px);
        padding: 36px 30px 28px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.15);
        box-shadow: 0 30px 60px rgba(2, 6, 23, 0.44);
      }

      .login-header {
        margin-bottom: 28px;
      }

      .login-header h2 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.4rem);
        letter-spacing: -0.06em;
      }

      .login-header p {
        margin: 0;
        color: var(--muted);
      }

      .input-group {
        position: relative;
        margin-bottom: 18px;
      }

      .input-group svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        stroke: rgba(148, 163, 184, 0.85);
      }

      .input-group input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.15);
        background: var(--input);
        color: var(--text);
        border-radius: 14px;
        padding: 16px 16px 16px 48px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .input-group input:focus {
        border-color: rgba(139, 92, 246, 0.8);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.14);
      }

      .input-group input::placeholder {
        color: #7f8aa4;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 8px 0 22px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .checkbox-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .checkbox-wrap input {
        accent-color: var(--primary);
        width: 15px;
        height: 15px;
      }

      .link {
        color: #c4b5fd;
        text-decoration: none;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-3));
        color: white;
        box-shadow: 0 16px 28px rgba(139, 92, 246, 0.35);
      }

      .secondary-btn {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.92);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .primary-btn:hover,
      .secondary-btn:hover,
      .password-toggle:hover {
        transform: translateY(-1px);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 20px 0 16px;
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.16);
      }

      .signup {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
      }

      .signup a {
        color: #c4b5fd;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 860px) {
        .login-shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .brand-panel {
          padding-bottom: 36px;
        }

        .brand-copy {
          margin-top: 42px;
        }

        .stats {
          grid-template-columns: repeat(3, minmax(80px, 1fr));
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 18px;
        }

        .login-card {
          padding: 24px 18px 20px;
        }

        .brand-panel {
          padding: 30px 22px 20px;
        }

        .options-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel">
        <div class="brand-top">
          <div class="brand-mark" aria-hidden="true"></div>
          <span>Axis</span>
        </div>

        <div class="brand-copy">
          <div class="eyebrow">Smart workspace</div>
          <h1>Build what matters.</h1>
          <p>
            Secure collaboration and product delivery for modern teams with one intuitive workspace.
          </p>
        </div>

        <div class="stats" aria-label="platform statistics">
          <div class="stat">
            <strong>7.2k</strong>
            <span>teams</span>
          </div>
          <div class="stat">
            <strong>99.9%</strong>
            <span>uptime</span>
          </div>
          <div class="stat">
            <strong>24/7</strong>
            <span>support</span>
          </div>
        </div>
      </section>

      <section class="form-panel">
        <div class="login-card">
          <div class="login-header">
            <h2>Welcome back</h2>
            <p>Sign in to continue to your dashboard</p>
          </div>

          <form>
            <div class="input-group">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" placeholder="Username or email" aria-label="Username or email" />
            </div>

            <div class="input-group">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
              </svg>
              <input id="passwordInput" type="password" placeholder="Password" aria-label="Password" />
              <button type="button" class="password-toggle" aria-label="Show password" data-toggle="password">Show</button>
            </div>

            <div class="options-row">
              <label class="checkbox-wrap">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">Sign in</button>

            <div class="divider">or</div>

            <button type="button" class="secondary-btn">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20c10.493 0 19.438-7.64 19.438-18.003 0-1.34-.145-2.64-.427-3.914Z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.818C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.334 6.306 14.691Z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 34.91 26.715 36 24 36c-5.223 0-9.654-3.343-11.303-8l-6.563 5.073C4.835 38.556 13.322 44 24 44Z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-1.163 3.285-3.828 6.116-7.304 7.4l6.19 5.238C39.31 38.54 44 32.36 44 24c0-1.34-.145-2.64-.427-3.914Z"/>
              </svg>
              Continue with Google
            </button>
          </form>

          <div class="signup">
            Don’t have an account? <a href="#">Create one</a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const toggleButton = document.querySelector('[data-toggle="password"]');
      const passwordInput = document.getElementById('passwordInput');

      toggleButton.addEventListener('click', () => {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        toggleButton.textContent = isHidden ? 'Hide' : 'Show';
      });
    </script>
  </body>
</html>
